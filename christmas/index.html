<style>
:root{
  --red:#D7263D; --red-dk:#B3172B; --green:#13774A; --green-2:#169055; --blue:#1F6FE5; --navy:#0B2E5C;
  --card:#FFFDF8; --ink:#1A1C22; --soft:#4A4D57; --line:#0B2E5C; --ph:#EFE7DA;
  color-scheme:only light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:600 1rem/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  background:#0E1B33; padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}

/* Christmas lights: the header of the Program section */
.lights{display:flex; justify-content:space-between; height:54px; padding:0 4px; overflow:hidden}
.bulb{position:relative; flex:1; display:flex; justify-content:center}
.bulb::before{content:""; position:absolute; top:-12px; left:0; right:0; height:24px; border-bottom:2px solid #5E7C6A; border-radius:0 0 50% 50%}
.bulb i{position:relative; margin-top:12px; width:14px; height:22px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:var(--c);
  box-shadow:0 0 10px 2px var(--c), 0 0 22px 6px var(--glow); animation:twinkle 2.6s ease-in-out infinite; animation-delay:var(--d)}
.bulb i::before{content:""; position:absolute; top:-6px; left:3px; width:8px; height:7px; border-radius:2px; background:#56705F}
.bulb:nth-child(4n+1){--c:#FF4D5E; --glow:rgba(255,77,94,.35)}
.bulb:nth-child(4n+2){--c:#3DDC84; --glow:rgba(61,220,132,.32)}
.bulb:nth-child(4n+3){--c:#4C9BFF; --glow:rgba(76,155,255,.35)}
.bulb:nth-child(4n){--c:#FFD25E; --glow:rgba(255,210,94,.35)}
@keyframes twinkle{0%,100%{opacity:1} 50%{opacity:.45; box-shadow:0 0 4px 1px var(--c)}}
@media (prefers-reduced-motion: reduce){ .bulb i{animation:none} }
.serif{font-family:"Playfair Display", Georgia, serif}
.script{font-family:"Great Vibes", "Segoe Script", cursive; font-weight:400}
[hidden]{display:none !important}
a{color:#0B5CC4; font-weight:800; text-underline-offset:3px}
a:hover{color:#084391}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.card{max-width:32rem; margin:0 auto; background:var(--card); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.35)}
.intro,.details{min-width:0}
.details{display:flex; flex-direction:column}
.baubles{display:block; width:100%; max-width:460px; height:auto; margin:0 auto}
.orn{transform-box:view-box; animation:swing 4.5s ease-in-out infinite alternate}
.orn:nth-of-type(2n){animation-duration:5.5s; animation-direction:alternate-reverse}
@keyframes swing{from{transform:rotate(-3deg)} to{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){ .orn{animation:none} }

.head{padding:0 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px}
.greet{margin:0; font-size:2.6rem; line-height:1; color:var(--red-dk)}
.kicker{margin:6px 0 0; font-weight:800; font-size:.78rem; letter-spacing:4px; color:var(--green)}
h1{margin:0; text-wrap:balance; font-weight:800; font-size:clamp(2.1rem, 9vw, 2.6rem); line-height:1.08; color:var(--navy)}

.ticket{margin:22px 22px 0; border:2px solid var(--line); border-radius:6px}
.ticket .row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr))}
.ticket .cell{padding:14px; text-align:center; display:flex; flex-direction:column; gap:2px}
.ticket .row .cell:first-child{border-right:2px solid var(--line)}
.ticket .place{border-top:2px solid var(--line)}
.lab{margin:0; font-size:.7rem; font-weight:800; letter-spacing:2px; color:var(--green)}
.val{margin:0; font-weight:700; font-size:1.25rem; line-height:1.25}
.sub{margin:0; font-size:.9rem; font-weight:700; color:var(--soft)}
.links{display:flex; justify-content:center; flex-wrap:wrap; gap:4px 22px; margin-top:12px}
.links a{display:inline-flex; align-items:center; min-height:44px}
.note{margin:10px 28px 0; text-align:center; font-weight:700; line-height:1.5; color:#33363F; white-space:pre-line}
.sign{margin:8px 0 0; text-align:center; font-size:1.7rem; color:var(--navy)}

.extras{display:grid; grid-template-columns:minmax(0,1fr); gap:30px; padding:30px 22px 0}
.block{min-width:0}
.block > h2{margin:6px 0 0; text-align:center; font-weight:800; font-size:1.65rem; color:var(--red-dk)}
.menu-art{display:block; width:100%; max-width:400px; height:auto; margin:0 auto}
.menu-list{list-style:none; margin:12px 0 0; padding:0; display:grid; grid-template-columns:minmax(0,1fr); column-gap:26px}
.menu-list li{display:flex; gap:12px; align-items:baseline; padding:10px 2px; border-bottom:1px dashed #DCD3C3}
.menu-list li::before{content:""; flex:none; width:10px; height:10px; border-radius:50%; background:var(--dot); transform:translateY(-1px)}
.menu-list li:nth-child(3n+1){--dot:var(--red)} .menu-list li:nth-child(3n+2){--dot:var(--green)} .menu-list li:nth-child(3n){--dot:var(--blue)}
.menu-list .dish{font-weight:800}
.menu-list .by{margin-left:auto; padding-left:8px; text-align:right; color:var(--soft); font-size:.9rem; font-weight:700}
.prog-head{background:#0E1B33; border-radius:12px 12px 0 0; padding-bottom:14px; text-align:center}
.prog-head h2{margin:0; font-weight:800; font-size:1.65rem; color:#FFFFFF}
.prog{list-style:none; margin:0; padding:4px 18px 8px; border:2px solid #0E1B33; border-top:0; border-radius:0 0 12px 12px}
.prog li{display:grid; grid-template-columns:5.6rem minmax(0,1fr); gap:12px; align-items:baseline; padding:11px 0; border-bottom:1px dashed #DCD3C3}
.prog li:last-child{border-bottom:0}
.prog .t{font-weight:800; color:var(--green); white-space:nowrap}
.prog .what{font-weight:700}
@media (min-width:560px){ .menu-list.many{grid-template-columns:repeat(2,minmax(0,1fr))} }
.photos-h{margin:30px 22px 0; display:flex; align-items:center; gap:12px}
.photos-h span{flex:1; height:2px; background:var(--green)}
.photos-h h2{margin:0; font-weight:800; font-size:1.65rem; color:var(--red-dk)}
.photos-sub{margin:6px 22px 0; text-align:center; font-weight:700; color:var(--soft)}
.grid{margin:20px 22px 0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 14px}
.grid button{position:relative; display:block; width:100%; border:0; padding:6px; background:#FFFFFF; box-shadow:0 3px 10px rgba(0,0,0,.14); cursor:pointer}
.grid button::before{content:""; position:absolute; z-index:1; top:-9px; left:50%; width:54px; height:16px; margin-left:-27px; background:var(--tape); opacity:.85; transform:rotate(var(--tilt))}
.grid button:nth-child(3n+1){--tape:var(--red); --tilt:-4deg}
.grid button:nth-child(3n+2){--tape:var(--green); --tilt:3deg}
.grid button:nth-child(3n){--tape:var(--blue); --tilt:-2deg}
.grid img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover; background:var(--ph)}
.foot{margin:auto 0 0; padding:28px 0 26px; text-align:center; font-size:1.9rem; color:var(--green)}

/* photo viewer */
dialog.viewer{width:100vw; height:100vh; height:100dvh; max-width:none; max-height:none; margin:0; padding:0; border:0; border-radius:0; background:rgba(10,12,16,.96); color:#fff; overflow:hidden}
dialog.viewer::backdrop{background:rgba(0,0,0,.9)}
.vstage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(84px + env(safe-area-inset-bottom,0px)); touch-action:pan-y pinch-zoom; user-select:none; -webkit-user-select:none}
.vstage img{display:block; max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; transition:opacity .2s ease}
.vstage img.loading{opacity:.2}
.vmsg{position:absolute; inset:0; margin:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:#C9CDD3; pointer-events:none}
.vbtn{position:absolute; z-index:2; width:52px; height:52px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; font:800 1.9rem/1 "Nunito",sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center}
.vbtn:hover{background:rgba(255,255,255,.26)}
.vclose{top:calc(12px + env(safe-area-inset-top,0px)); right:12px; font-size:1.6rem}
.vprev,.vnext{top:50%; transform:translateY(-50%)}
.vprev{left:12px} .vnext{right:12px}
.vbar{position:absolute; z-index:2; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; align-items:center; gap:14px; font-weight:800}
.vcount{min-width:5.5em; text-align:center}
.vdl{display:inline-flex; align-items:center; min-height:44px; padding:.4rem 1.1rem; border-radius:8px; background:#FFFFFF; color:var(--red-dk); text-decoration:none}
.vdl:hover{color:var(--red-dk)}
@media (max-width:600px){ .vprev,.vnext{width:44px; height:44px; font-size:1.6rem; background:rgba(255,255,255,.12)} .vprev{left:6px} .vnext{right:6px} }
@media (prefers-reduced-motion: reduce){ .vstage img{transition:none} }

@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* computers: full width, invitation on the left, details on the right, photos across the bottom */
@media (min-width:900px){
  body{padding-left:24px; padding-right:24px}
  .card{max-width:none; width:100%; max-width:1800px; margin-top:10px; display:grid; grid-template-columns:minmax(340px, 1fr) minmax(0, 1.25fr);
    grid-template-areas:"intro details" "photos photos" "foot foot"}
  .intro{grid-area:intro; padding:10px 0 34px; border-right:2px dashed #E3DCCF}
  .card{grid-template-areas:"intro details" "intro more" "extras extras" "photos photos" "foot foot"}
  .extras{grid-area:extras; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px; padding:34px clamp(24px, 3vw, 48px) 6px; border-top:2px dashed #E3DCCF}
  .extras.one{grid-template-columns:minmax(0,1fr)}
  .menu-list.many{grid-template-columns:minmax(0,1fr)}
  .details{grid-area:details; justify-content:flex-end; padding:40px clamp(24px, 4vw, 64px) 0}
  .details .ticket{margin:0}
  .more{grid-area:more; padding:4px clamp(24px, 4vw, 64px) 34px}
  .more .note,.more .sign{margin-left:0; margin-right:0}
  .photos{grid-area:photos; padding:8px clamp(24px, 3vw, 48px) 0; border-top:2px dashed #E3DCCF}
  .foot{grid-area:foot}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr)); margin-left:0; margin-right:0}
  .photos-h,.photos-sub{margin-left:0; margin-right:0}
  .ticket .val{font-size:1.45rem}
}
/* wide screens: three columns, the details split into the ticket and the note */
@media (min-width:1280px){
  .card{grid-template-columns:minmax(360px, 1fr) minmax(0, 1fr) minmax(300px, .8fr); grid-template-areas:"intro details more" "extras extras extras" "photos photos photos" "foot foot foot"}
  .menu-list.many{grid-template-columns:repeat(2,minmax(0,1fr))}
  .details{justify-content:center; padding:36px 28px 34px clamp(24px, 3vw, 48px)}
  .more{grid-area:more; display:flex; flex-direction:column; justify-content:center; padding:36px 48px 34px 28px}
  .more .note{margin:0; text-align:left; font-size:1.08rem}
  .more .sign{text-align:left}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>

const FALLBACK = JSON.parse($("event-data").textContent);
let EV = { ...FALLBACK };
const configured = window.supabase && typeof window.SUPABASE_URL === "string" && !/YOUR_/.test(window.SUPABASE_URL + window.SUPABASE_ANON_KEY);
const sb = configured ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

// Christmas lights across the Program header: one bulb per ~44px, rebuilt when the width changes
function hangLights(){
  const w = $("lights").clientWidth;
  if (!w) return;
  const n = Math.max(5, Math.round(w / 44));
  const box = $("lights");
  if (box.children.length === n) return;
  box.replaceChildren(...Array.from({ length: n }, (_, i) => {
    const b = document.createElement("span"); b.className = "bulb";
    const g = document.createElement("i"); g.style.setProperty("--d", `${((i * 7) % 11) * -0.37}s`);
    b.appendChild(g); return b;
  }));
}
let lightsT; addEventListener("resize", () => { clearTimeout(lightsT); lightsT = setTimeout(hangLights, 150); });

// old ?owner links go to the owner page
if (/[?&#]owner\b/.test(location.search + location.hash)) location.replace("owner.html");

const hm = t => String(t || "").split(":").map(Number);
const fmtTime = t => { const [h, m] = hm(t); return new Date(2000, 0, 1, h, m || 0).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };
const pad = n => String(n).padStart(2, "0");
function stamp(dateStr, timeStr, addHours){
  const [y, mo, d] = dateStr.split("-").map(Number), [h, m] = hm(timeStr);
  const t = new Date(Date.UTC(y, mo - 1, d, h || 0, m || 0) + (addHours || 0) * 3600e3);
  return `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00`;
}

function render(){
  const d = new Date(EV.date + "T00:00:00");
  $("greeting").textContent = EV.greeting || "Merry Christmas";
  $("title").textContent = EV.title || "Our Christmas Party";
  document.title = `${EV.title || "Christmas party"}: you’re invited!`;
  $("date").textContent = isNaN(d) ? "" : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  $("time").textContent = EV.end ? `${fmtTime(EV.start)} – ${fmtTime(EV.end)}` : fmtTime(EV.start);
  $("venue").textContent = EV.venue || "";
  $("address").textContent = EV.address || "";
  $("note").textContent = EV.note || "";
  $("sign").textContent = [EV.signoff, EV.host].filter(Boolean).join(" ");

  // end time: the one entered, else 4 hours after the start (handles parties that run past midnight)
  let end = EV.end ? stamp(EV.date, EV.end) : stamp(EV.date, EV.start, 4);
  if (EV.end && end <= stamp(EV.date, EV.start)) end = stamp(EV.date, EV.end, 24);
  $("calBtn").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(EV.title || "Christmas party")
    + "&dates=" + stamp(EV.date, EV.start) + "/" + end
    + "&ctz=" + encodeURIComponent(EV.timezone || "Asia/Manila")
    + "&location=" + encodeURIComponent([EV.venue, EV.address].filter(Boolean).join(", "))
    + "&details=" + encodeURIComponent(EV.note || "");
  $("mapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([EV.venue, EV.address].filter(Boolean).join(" "));
  $("mapBtn").hidden = !(EV.venue || EV.address);
  renderLists();
  renderGallery();
}

// Menu ("Dish - note") and program ("6:00 PM - Dinner"), one per line, typed in owner.html
const lines = v => String(v || "").split("\n").map(x => x.trim()).filter(Boolean);
const pair = l => { const m = l.match(/^(.*?)\s+[-–—|]\s+(.*)$/); return m ? [m[1].trim(), m[2].trim()] : [l, ""]; };
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function renderLists(){
  const menu = lines(EV.menu).map(pair), prog = lines(EV.program).map(pair);
  $("menuList").replaceChildren(...menu.map(([dish, by]) => { const li = el("li"); li.append(el("span", "dish", dish)); if (by) li.append(el("span", "by", by)); return li; }));
  $("menuList").classList.toggle("many", menu.length > 5);
  // a program line with no " - " is just an activity, with no time
  $("progList").replaceChildren(...prog.map(([a, b]) => { const li = el("li"); li.append(el("span", "t", b ? a : ""), el("span", "what", b || a)); return li; }));
  $("menuBlock").hidden = !menu.length;
  $("progBlock").hidden = !prog.length;
  $("extras").hidden = !menu.length && !prog.length;
  $("extras").classList.toggle("one", !menu.length || !prog.length);
  hangLights();
}

// ---------- photo viewer: swipe or arrows, counter, download ----------
const V = { list: [], i: 0 };
const lb = document.createElement("dialog");
lb.className = "viewer";
lb.setAttribute("aria-label", "Photo viewer");
lb.innerHTML = `<div class="vstage"><img alt=""><p class="vmsg" hidden>Couldn’t load this photo.</p></div>
  <button type="button" class="vbtn vclose" aria-label="Close">×</button>
  <button type="button" class="vbtn vprev" aria-label="Previous photo">‹</button>
  <button type="button" class="vbtn vnext" aria-label="Next photo">›</button>
  <div class="vbar"><span class="vcount" aria-live="polite"></span><a class="vdl" target="_blank" rel="noopener">Download</a></div>`;
document.body.appendChild(lb);
const vImg = lb.querySelector(".vstage img"), vMsg = lb.querySelector(".vmsg");
vImg.referrerPolicy = "no-referrer";
vImg.onload = () => vImg.classList.remove("loading");
vImg.onerror = () => { vImg.classList.remove("loading"); vImg.style.visibility = "hidden"; vMsg.hidden = false; };
let swiped = false;
function showPhoto(i){
  const n = V.list.length;
  V.i = (i + n) % n;
  const it = V.list[V.i];
  vMsg.hidden = true; vImg.style.visibility = "";
  vImg.classList.add("loading");
  vImg.alt = `Photo ${V.i + 1} of ${n}`;
  vImg.src = it.full;
  lb.querySelector(".vcount").textContent = `${V.i + 1} of ${n}`;
  lb.querySelector(".vdl").href = it.dl;
  lb.querySelector(".vprev").hidden = lb.querySelector(".vnext").hidden = n < 2;
  if (n > 1) [V.i + 1, V.i - 1].forEach(k => { const p = new Image(); p.referrerPolicy = "no-referrer"; p.src = V.list[(k + n) % n].full; });
}
function openViewer(list, item){
  V.list = list.filter(x => !x.bad);
  if (!V.list.length) return;
  lb.showModal();
  showPhoto(Math.max(0, V.list.indexOf(item)));
}
lb.querySelector(".vclose").addEventListener("click", () => lb.close());
lb.querySelector(".vprev").addEventListener("click", () => showPhoto(V.i - 1));
lb.querySelector(".vnext").addEventListener("click", () => showPhoto(V.i + 1));
lb.querySelector(".vstage").addEventListener("click", e => { if (e.target !== vImg && !swiped) lb.close(); });
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); showPhoto(V.i + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); showPhoto(V.i - 1); }
});
let sx = null, sy = 0;
lb.addEventListener("touchstart", e => { if (e.touches.length !== 1) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && V.list.length > 1) {
    swiped = true; setTimeout(() => { swiped = false; }, 400);
    showPhoto(V.i + (dx < 0 ? 1 : -1));
  }
});

// ---------- gallery: uploaded photos + an optional Google Drive folder ----------
const listOf = key => (Array.isArray(EV[key]) ? EV[key] : []).filter(u => typeof u === "string" && u);
const supaDownload = u => /\/storage\/v1\/object\/public\//.test(u) ? u + (u.includes("?") ? "&" : "?") + "download=" : u;
const isFeed = u => typeof u === "string" && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
const driveImg = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
let DRIVE = [];
async function loadDrive(){
  if (!isFeed(EV.driveFeed)) return;
  try {
    const j = await (await fetch(EV.driveFeed)).json();
    if (j && j.ok && Array.isArray(j.photos)) {
      DRIVE = j.photos.map(p => p && p.id).filter(id => typeof id === "string" && /^[\w-]{10,}$/.test(id));
      renderGallery();
    }
  } catch {}
}
function photoButton(item, i, list){
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", `Open photo ${i + 1}`);
  const img = new Image(); img.referrerPolicy = "no-referrer"; img.alt = ""; img.loading = "lazy";
  img.onerror = () => { item.bad = true; b.remove(); if (!$("grid").children.length) $("photosSub").hidden = false; };
  img.src = item.thumb;
  b.appendChild(img);
  b.addEventListener("click", () => openViewer(list, item));
  return b;
}
function renderGallery(){
  const items = [
    ...listOf("photos").map(u => ({ thumb: u, full: u, dl: supaDownload(u) })),
    ...DRIVE.map(id => ({ thumb: driveImg(id, 800), full: driveImg(id, 2000), dl: `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}` }))];
  $("grid").replaceChildren(...items.map((it, i) => photoButton(it, i, items)));
  $("photosSub").textContent = items.length ? "Tap a photo to see it big. Swipe for the next one." : "Snaps from the night show up here after the party.";
  $("photosSub").hidden = false;
}

// ---------- start ----------
async function loadEvent(){
  if (!sb) return;
  try {
    const { data, error } = await sb.from("events").select("data").eq("slug", SLUG).maybeSingle();
    if (!error && data && data.data) EV = { ...FALLBACK, ...data.data };
  } catch {}
}
(async () => {
  await Promise.race([loadEvent(), new Promise(r => setTimeout(r, 3000))]);
  render();
  loadDrive();
})();
</script>
